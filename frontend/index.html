  <script>
    // Tema claro por padrão (Bizneo style); vai para escuro se o usuário escolheu antes.
    try { if (localStorage.getItem('cortex_theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}
    // Apresentação: cobre a página com o fundo escuro desde o primeiro quadro, para a
    // tela de login não "piscar" antes da animação. O intro.js remove a cobertura.
    try {
      var cxWillIntro = !localStorage.getItem('cortex_token')
        && localStorage.getItem('cortex_intro') !== '0'
        && sessionStorage.getItem('cortex_intro_seen') !== '1'
        && !/[?&]reset_token=/.test(location.search)
        && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
      if (cxWillIntro) {
        document.documentElement.classList.add('cx-intro-pending');
        setTimeout(function () { document.documentElement.classList.remove('cx-intro-pending'); }, 6000);
      }
    } catch (e) {}
  </script>
  <style>
    /* :not(#cx-none) só aumenta a prioridade, para vencer o fundo do mosaic.css */
    html.cx-intro-pending, html.cx-intro-pending body:not(#cx-none) { background: #040815 !important; }
    html.cx-intro-pending body > * { visibility: hidden !important; }
    html.cx-intro-pending body > .cx-intro { visibility: visible !important; }
  </style>

  <script>
    function toggleSidebar() {
      const s = document.getElementById('sidebar');
      const o = document.getElementById('sidebar-overlay');
      const isOpen = !s.classList.contains('-translate-x-full');
      s.classList.toggle('-translate-x-full');
      o.classList.toggle('hidden', isOpen);
    }
    function closeSidebar() {
      if (window.innerWidth >= 768) return;
      const s = document.getElementById('sidebar');
      const o = document.getElementById('sidebar-overlay');
      s.classList.add('-translate-x-full');
      o.classList.add('hidden');
    }
    function toggleSidebarCompact() {
      const s = document.getElementById('sidebar');
      const compact = s.classList.toggle('cx-sb-compact');
      s.style.width = compact ? '56px' : '220px';
      try { localStorage.setItem('cortex_sb_expanded', compact ? '0' : '1'); } catch(e) {}
    }
    // Por padrão compact; expande só se o usuário escolheu antes
    try {
      if (localStorage.getItem('cortex_sb_expanded') === '1') {
        const s = document.getElementById('sidebar');
        s.classList.remove('cx-sb-compact');
        s.style.width = '220px';
      }
    } catch(e) {}

    // Tooltip flutuante para sidebar compacto
    (function() {
      const tip = document.createElement('div');
      tip.id = 'cx-nav-tooltip';
      document.body.appendChild(tip);
      document.addEventListener('mouseover', function(e) {
        const sb = document.getElementById('sidebar');
        if (!sb || !sb.classList.contains('cx-sb-compact')) return;
        const btn = e.target.closest('.nav-item[data-label]');
        if (!btn) return;
        const label = btn.getAttribute('data-label').replace(/&amp;/g,'&');
        if (!label) return;
        const rect = btn.getBoundingClientRect();
        tip.textContent = label;
        tip.style.top = (rect.top + rect.height / 2 - 13) + 'px';
        tip.classList.add('visible');
      });
      document.addEventListener('mouseout', function(e) {
        if (!e.target.closest('.nav-item[data-label]')) return;
        tip.classList.remove('visible');
      });
    })();
  </script>
